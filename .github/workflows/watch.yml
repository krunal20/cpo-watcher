name: cpo-watch
run-name: watch ${{ inputs.run_label || format('sched-{0}', github.run_id) }}

on:
  workflow_dispatch:
    inputs:
      run_label:
        description: Optional label for this run
        required: false
      bootstrap:
        description: "Record current inventory as already-seen (no email). Use on first run."
        required: false
        default: "false"
      dry_run:
        description: "Don't save state, don't send email"
        required: false
        default: "false"
      force:
        description: "Override safety guards (re-bootstrap over existing state, or send an email exceeding the new-listings cap)"
        required: false
        default: "false"
  schedule:
    - cron: '*/15 * * * *'

concurrency:
  group: cpo-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    # Stay well under the 15-min cron interval. GitHub Actions concurrency keeps at
    # most one queued run per group, so a run that exceeds the interval causes the
    # next scheduled tick to be cancelled. Capping at 7 min leaves headroom for
    # jitter (up to 30s) + 5 dealers * up to ~90s with retries ≈ 8 min worst case
    # — and the timeout will kill anything stuck so we don't drop multiple ticks.
    timeout-minutes: 7
    env:
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: '587'
      SMTP_USER: ${{ secrets.GMAIL_USERNAME }}
      SMTP_PASS: ${{ secrets.GMAIL_APP_PASSWORD }}
      ALERT_TO:  ${{ secrets.ALERT_RECIPIENT }}
      BOOTSTRAP_FLAG: ${{ inputs.bootstrap == 'true' && '--bootstrap' || '' }}
      DRY_RUN_FLAG:   ${{ inputs.dry_run   == 'true' && '--dry-run'   || '' }}
      FORCE_FLAG:     ${{ inputs.force     == 'true' && '--force'     || '' }}
    steps:
      - name: Checkout code (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: code

      - name: Checkout state branch
        uses: actions/checkout@v4
        with:
          ref: watch-state
          path: state
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: code/requirements.txt

      - run: pip install -r code/requirements.txt

      - name: Mask sensitive env
        # secrets.* are auto-masked by GitHub already; these calls are
        # belt-and-braces in case any value gets re-derived later.
        run: |
          [ -n "$ALERT_TO" ] && echo "::add-mask::$ALERT_TO" || true
          [ -n "$SMTP_USER" ] && echo "::add-mask::$SMTP_USER" || true
          [ -n "$SMTP_PASS" ] && echo "::add-mask::$SMTP_PASS" || true

      - name: Verify required secrets
        # Fail fast if a secret is unset. Without this, every 15-min cron tick
        # would hit the dealer APIs only to discover at the end there's nowhere
        # to email — wasteful and impolite to the dealers.
        run: |
          missing=()
          [ -z "$SMTP_USER" ] && missing+=("GMAIL_USERNAME")
          [ -z "$SMTP_PASS" ] && missing+=("GMAIL_APP_PASSWORD")
          [ -z "$ALERT_TO" ]  && missing+=("ALERT_RECIPIENT")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::missing repository secret(s): ${missing[*]}. Set them at Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Run watcher
        id: run
        continue-on-error: true
        working-directory: code
        run: |
          python -m watcher --state-root "$GITHUB_WORKSPACE/state" $BOOTSTRAP_FLAG $DRY_RUN_FLAG $FORCE_FLAG

      - name: Commit state
        if: steps.run.outcome == 'success' && inputs.dry_run != 'true'
        working-directory: state
        run: |
          set -euo pipefail
          git config user.email bot@cpo-watcher
          git config user.name  cpo-watcher-bot
          # Belt and braces: drop any leftover tmp files before staging.
          rm -f -- *.json.tmp *.tmp
          # Back up the freshly-written state outside the working tree so we can
          # restore it after a destructive `git reset --hard` during rebase retries.
          # Set the cleanup trap BEFORE cp so a cp failure doesn't leak the tmp file
          # (set -e would abort before a later trap could be registered).
          STATE_BACKUP=$(mktemp)
          trap 'rm -f "$STATE_BACKUP"' EXIT
          cp state.json "$STATE_BACKUP"
          git add -A
          if git diff --cached --quiet; then
            echo "no state change"
            exit 0
          fi
          STAMP=$(date -u +%FT%TZ)
          git commit -m "state: $STAMP"
          for i in 1 2 3; do
            if git push origin HEAD:watch-state; then exit 0; fi
            echo "push failed, rebasing on remote (attempt $i)"
            git fetch origin watch-state
            git reset --hard origin/watch-state
            cp "$STATE_BACKUP" state.json
            git add -A
            if git diff --cached --quiet; then
              echo "remote already has our state; nothing to push"
              exit 0
            fi
            git commit -m "state: $STAMP (rebased)"
            sleep $((i * 5))
          done
          echo "::error::state push failed after retries"
          exit 1

      - name: Propagate watcher failure
        if: steps.run.outcome == 'failure'
        run: |
          echo "::error::watcher run failed; see logs above"
          exit 1
